# Money — a live view of a self-hosted Securo personal-finance server.
# Nothing financial is stored in Atlas. The password is entered in Setup
# (stored encrypted, only ever sent to this base_url's host), or set in .env:
#   SECURO_PASSWORD=
# The account must not have 2FA on — Securo then never hands out a token.

# Where atlas-api reaches Securo's backend. `backend:8000` works when Atlas
# joins Securo's docker network (see docker-compose.override.example.yml).
base_url: http://backend:8000

# The Securo account Atlas signs in as.
# email: you@example.com

# Where *your browser* reaches Securo, for the "open Securo" link. Optional.
public_url: ""

# Optional: pin one workspace. Blank uses the account's oldest, like Securo does.
workspace_id: ""
