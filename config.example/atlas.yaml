# Atlas — who this dashboard is for and what it shows.
# Setup writes config/ for you the first time you open Atlas; this folder is
# the reference for editing it by hand. A change applies within seconds.

# The greeting on Today: "Hello, Sam!". Leave blank for just "Hello!".
name: Sam

# Where "today" starts and ends: habit ticks, the day's weather high/low,
# which night counts as last night. Any IANA zone name.
timezone: America/New_York

# The modules that are on. Only the two that need no account start on, so a
# fresh install has nothing to set up. To add one, uncomment its line and fill
# in its file in modules/ (secrets go in Setup or .env, never here). Delete a line to
# switch a module off — its screen, its widgets and its sync all go away;
# nothing it stored is deleted.
modules:
  - open_meteo       # Open-Meteo forecast + archive. No account needed.
  - habits           # Daily habit ticks and streaks. No account needed.
  # - work           # Your weekly work shifts, entered by hand.
  # - securo         # Money, from a self-hosted Securo.
  # - audiobookshelf # What you're listening to, from Audiobookshelf.
  # - canvas         # Assignments and classes, from a Canvas calendar feed.
  # - google_health  # Sleep and activity from Fitbit / Pixel Watch.

# Demo data: set `demo: true`, turn on work, canvas and google_health above,
# then run `docker compose exec atlas-api python -m app.demo` to fill an empty
# install with a made-up student's week. Canvas and Google Health then need no
# account and their syncs touch nothing. Never on a real install.
# demo: true
