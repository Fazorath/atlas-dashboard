# Builds the Atlas Manual (docs/manual, Astro Starlight) and publishes it to
# GitHub Pages at https://fazorath.github.io/atlas-dashboard/.
#
# This file is identical in atlas-private and the public atlas-dashboard repo.
# Both build the Manual (a docs check); only atlas-dashboard uploads and deploys,
# because Pages is enabled there and must stay off in the private repo.
#
# One-time setup in atlas-dashboard: Settings -> Pages -> Source: "GitHub Actions".
name: Manual

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push wins, but a running deploy is not cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/manual/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - if: github.repository == 'Fazorath/atlas-dashboard'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manual/dist

  deploy:
    if: github.repository == 'Fazorath/atlas-dashboard'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
