name: Idea
description: A widget, module or change you'd like
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you want on your dashboard, and what would it show?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where the data lives
      description: The app or API it would come from, if any
