name: Bug
description: Something broke or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: modules
    attributes:
      label: Modules on
      description: The `modules:` list from config/atlas.yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs atlas-api --tail 50`. Check it for tokens or URLs before pasting."
      render: text
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: iPhone home-screen app, desktop Firefox...
