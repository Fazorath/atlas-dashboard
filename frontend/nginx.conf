# Serves the built SPA and proxies /api to atlas-api. Listens on 8080 so the
# container can run unprivileged with read_only + no-new-privileges.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is public — Tailscale is the boundary — but these cost
    # nothing and keep the browser honest. nginx drops inherited add_header
    # lines in any location that sets its own, so the two below that add
    # Cache-Control repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://atlas-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sync endpoints hit slow upstreams; do not cut them off at 60s.
        proxy_read_timeout 180s;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # keeps serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Client-side routing: /sleep, /money etc. are React Router paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
